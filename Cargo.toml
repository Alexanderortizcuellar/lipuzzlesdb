[package]
name = "lipuzzlesdb"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity"]
description = "High-performance zero-copy memory-mapped chess puzzles database"

[lib]
name = "lipuzzles"
path = "src/lib.rs"

[[bin]]
name = "lpdb"
path = "src/main.rs"

[dependencies]
memmap2 = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
indicatif = { version = "0.17", features = ["rayon"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.18", features = ["derive"] }
zstd = "0.13"
csv = "1.3"
rayon = "1.10"
lz4_flex = "0.14.0"
ureq = "2.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
